services:
  postgres:
    image: postgres:16-alpine
    container_name: tesla-pool-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-tesla_pool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tesla_pool_pw}
      POSTGRES_DB: ${DB_NAME:-dhaka_tesla_pool}
    ports:
      - "5432:5432"
    volumes:
      - tesla_pool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tesla_pool} -d ${DB_NAME:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: tesla-pool-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/zones"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
    container_name: tesla-pool-web
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  tesla_pool_pgdata:
